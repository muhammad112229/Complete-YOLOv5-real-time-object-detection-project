[project]
name = "real-time-object-detection-yolov5"
version = "0.1.0"
description = "Reproducible YOLOv5 project for COCO 2017 training, evaluation, inference, optimization, and edge deployment preparation."
requires-python = ">=3.11,<3.12"
readme = "README.md"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

