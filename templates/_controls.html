<div class="control-grid">
  <label>
    <span>Confidence</span>
    <input type="number" name="confidence_threshold" value="0.25" min="0" max="1" step="0.01">
  </label>
  <label>
    <span>IoU</span>
    <input type="number" name="iou_threshold" value="0.45" min="0" max="1" step="0.01">
  </label>
  <label class="wide-control">
    <span>Class Filter</span>
    <input type="text" name="class_filter" list="class-list" placeholder="person, car">
  </label>
</div>
