{% extends "base.html" %}
{% block title %}Live Webcam Detection{% endblock %}
{% block content %}
<section class="result-header">
  <div>
    <h1>Live Webcam Detection</h1>
    <p>Camera index {{ status.camera_index }}</p>
  </div>
  <form action="{{ url_for('webcam_stop') }}" method="post">
    <button type="submit" class="secondary-button">Stop Camera</button>
  </form>
</section>

<section class="panel webcam-panel">
  <img src="{{ url_for('video_feed') }}" alt="Live webcam stream">
</section>
{% endblock %}
